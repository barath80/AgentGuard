{{- $fullname := include "agentguard.fullname" . -}}
# Schema migrations run once per install/upgrade, before new gateway pods start.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "agentguard.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "agentguard.image" . }}
          # As the schema owner: migrate, grant the runtime role exactly what it needs, then make sure
          # the tool registry and baseline policy exist (idempotent; never demo agents in production).
          command: ["sh", "-c", "alembic upgrade head && python -m agentguard.audit.grants --app-role \"$APP_ROLE\" && python -m agentguard.policy.seed"]
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: MIGRATION_DATABASE_URL } }
            - name: APP_ROLE
              value: {{ .Values.database.appRole | quote }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "agentguard.tmpVolume" . | nindent 8 }}
---
# Trained anomaly model artifact: placed here after evaluation in the notebook, read by the gateway.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-models
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.anomalyModel.storage.accessMode }}]
  {{- with .Values.anomalyModel.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.anomalyModel.storage.size }}
{{- if .Values.anomalyModel.driftCheck.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-anomaly-drift
  labels:
    {{- include "agentguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: drift-check
spec:
  schedule: {{ .Values.anomalyModel.driftCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "agentguard.labels" . | nindent 12 }}
            app.kubernetes.io/component: drift-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: drift-check
              image: {{ include "agentguard.image" . }}
              # Compares recent traffic with the served model's training data (read-only). Exits non-zero
              # when it has drifted, so the failed Job is the alert. It doesn't retrain: an unevaluated
              # model must not silently replace one evaluated in the notebook.
              command: ["python", "-m", "agentguard.ml.model", "--model-path", "/models/anomaly.joblib",
                        "drift", "--hours", "{{ .Values.anomalyModel.driftCheck.hours }}"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: DATABASE_URL } }
              securityContext: {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - { name: models, mountPath: /models, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: models
              persistentVolumeClaim: { claimName: {{ $fullname }}-models }
            {{- include "agentguard.tmpVolume" . | nindent 12 }}
{{- end }}
