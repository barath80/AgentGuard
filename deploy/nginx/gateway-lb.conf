# Load balancer in front of the gateway replicas (docker-compose `gateway-lb`).
#
# The gateway is stateless: every decision, rate limit, budget and approval lives in Postgres,
# and per-agent checks take a row lock there, so any replica can serve any call. That's what
# makes plain least-connections balancing correct here.

upstream gateway {
    least_conn;
    # Compose's DNS returns every `app` replica; nginx resolves them at start, so restart this
    # container after `docker compose up --scale app=N`.
    server app:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://gateway;
        # If a replica dies mid-request, retry on another one, even for POST. That's safe here
        # *because* every tool call carries an idempotency key that the database enforces
        # (uq_executions_agent_idempotency): a retried call returns the first execution,
        # never a second side effect.
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }

    location = /v1/console/stream {
        proxy_pass http://gateway;
        proxy_buffering off;  # server-sent events must flow as they're written
        proxy_read_timeout 1h;
    }

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
