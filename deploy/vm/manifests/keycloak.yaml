# Keycloak in production mode, behind Traefik with TLS. Only the realm endpoints are public
# (/realms, /resources); the admin console is not routed. Administer it with deploy/vm/add-*.sh,
# which run kcadm inside the pod. deploy.sh fills in ${SSO_HOST}.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          # --import-realm creates the realm on first start and skips it once it exists.
          args: ["start", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://postgres.data.svc:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: KC_DB_PASSWORD } }
            - { name: KC_HOSTNAME, value: "https://${SSO_HOST}" }
            # Lets in-cluster callers (the gateway's key fetches, kcadm) use the service address.
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            # Bootstrap admin of the master realm; its password stays in the Secret for kcadm.
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: KC_ADMIN_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: agentguard-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${SSO_HOST}"]
      secretName: keycloak-tls
  rules:
    - host: "${SSO_HOST}"
      http:
        paths:
          - { path: /realms/, pathType: Prefix, backend: { service: { name: keycloak, port: { name: http } } } }
          - { path: /resources/, pathType: Prefix, backend: { service: { name: keycloak, port: { name: http } } } }
---
# Reachable from Traefik (sign-in, token requests) and AgentGuard (signing keys) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: keycloak
spec:
  podSelector:
    matchLabels: { app: keycloak }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [kube-system, agentguard] }
      ports:
        - { protocol: TCP, port: 8080 }
