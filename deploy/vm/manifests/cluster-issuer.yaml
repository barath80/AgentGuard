# Let's Encrypt certificates for every Ingress annotated cert-manager.io/cluster-issuer: letsencrypt.
# deploy.sh fills in ${ACME_EMAIL}.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
