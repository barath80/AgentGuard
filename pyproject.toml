[project]
name = "agentguard"
version = "0.1.0"
description = "Runtime authorization, audit trails, and replay for enterprise AI agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# The Claude-powered support agent (agentguard.agents) and the live red-team evaluation.
agent = [
    "anthropic>=2.3",
]
# The Gemini-powered support agent (agentguard.agents.gemini_agent); the default for the live evaluation.
gemini = [
    "google-genai>=2.30",
]
# Anomaly model training and scoring (agentguard.ml).
ml = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]
# Training notebook (notebooks/anomaly_model.ipynb); use together with the ml extra.
notebook = [
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Header() are meant to be called in argument
# defaults — that's how the framework's DI works, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
